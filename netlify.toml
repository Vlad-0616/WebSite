[build]
  # Переходим в папку frontend и запускаем сборку
  command = "cd frontend && npm ci && npm run build"
  # Публикуем содержимое папки frontend/dist
  publish = "frontend/dist"

# Перенаправление всех маршрутов на index.html (для Vue Router)
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

# Кэширование статических ресурсов
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
